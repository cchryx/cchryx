name: Sync README from Inkference

on:
  schedule:
    - cron: "17 10 * * *" # every day, 6:17 am Toronto time (EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild README from Inkference
        run: node scripts/update-readme.mjs
        env:
          INKFERENCE_API_KEY: ${{ secrets.INKFERENCE_API_KEY }}

      - name: Commit if anything changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Sync projects and skills from Inkference"
          git push
